# Local dev stack. Copy .env.example to .env and set values (never commit .env).
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
    ports: ["127.0.0.1:1433:1433"]
  optimiser:
    build: ./src/optimiser
    ports: ["127.0.0.1:8001:8000"]
  api:
    build: ./src/Api
    depends_on: [sql, optimiser]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Optimiser__BaseUrl: http://optimiser:8000
      ConnectionStrings__Sql: "Server=sql,1433;Database=asx;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Auth__ApiKey: ${API_KEY:?set API_KEY in .env}
    ports: ["127.0.0.1:8080:8080"]
